const SUBJ = {r:"Riyaziyyat", i:"İngilis dili", a:"Azərbaycan dili"};
const WIN_RATE = 0.7;
const TIME_PER_Q = 0; // 0 = vaxt limiti yoxdur; məs. 30 yazsanız hər sual 30 saniyə olur

// ===== SƏS (Web Audio ilə yaradılır, ayrıca fayl lazım deyil) =====
let ac = null, muted = false, tickTimer = null;
function ctx(){
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === "suspended") ac.resume();
  return ac;
}
function tone(freq, start, dur, type = "square", vol = 0.12){
  if (muted) return;
  const c = ctx(), o = c.createOscillator(), g = c.createGain();
  const t = c.currentTime + start;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
// Orijinal melodiya (heç bir mövcud mahnıdan götürülməyib)
const THEME = [
  [392,0.25],[523,0.25],[659,0.25],[523,0.25],[784,0.5],[698,0.25],[659,0.25],[587,0.25],[659,0.5],
  [523,0.25],[659,0.25],[784,0.25],[880,0.25],[784,0.5],[659,0.25],[523,0.25],[587,0.75]
];
function playTheme(){
  if (muted) return;
  let t = 0;
  THEME.forEach(([f,d]) => { tone(f, t, d*0.9, "square", 0.08); t += d; });
  // basa vurma
  for (let i = 0; i < 8; i++) tone(110, i*0.5, 0.2, "triangle", 0.2);
}
function suspenseTick(){
  tone(1400, 0, 0.05, "sine", 0.06);
}
function startSuspense(){
  stopSuspense();
  let n = 0;
  tickTimer = setInterval(() => { suspenseTick(); if (++n > 20) stopSuspense(); }, 1000);
}
function stopSuspense(){ if (tickTimer){ clearInterval(tickTimer); tickTimer = null; } }
function sfxQuestion(){ tone(880, 0, 0.12, "sine", 0.15); tone(1100, 0.12, 0.2, "sine", 0.15); }
function sfxRight(){ [523,659,784,1046].forEach((f,i)=>tone(f, i*0.09, 0.18, "triangle", 0.18)); }
function sfxWrong(){ tone(220, 0, 0.35, "sawtooth", 0.15); tone(160, 0.3, 0.5, "sawtooth", 0.15); }
function sfxWin(){
  const seq = [523,523,523,698,784,698,784,1046];
  seq.forEach((f,i)=>tone(f, i*0.18, 0.22, "square", 0.14));
  tone(1046, 1.6, 1.2, "triangle", 0.2);
}
function toggleMute(){
  muted = !muted;
  document.getElementById("muteBtn").textContent = muted ? "🔇" : "🔊";
  if (muted) { stopSuspense(); }
}

// ===== OYUN =====
const app = document.getElementById("app");
let list = [], idx = 0, score = 0, locked = false, qTimer = null;

function shuffle(arr){
  const c = [...arr];
  for (let i = c.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [c[i], c[j]] = [c[j], c[i]];
  }
  return c;
}

// Sadə sinifdən çətinə doğru sıralama: hər sinifdə qarışdırılır, sonra bərabər paylanır
function prepare(n){
  const groups = {};
  QUESTIONS.forEach(q => (groups[q.g] = groups[q.g] || []).push(q));
  let all = [];
  Object.keys(groups).map(Number).sort((a,b)=>a-b)
    .forEach(g => { all = all.concat(shuffle(groups[g])); });
  const step = all.length / n;
  list = [];
  for (let i = 0; i < n; i++){
    const q = all[Math.floor(i * step)];
    const opts = q.o.map((t, k) => ({ t, c: k === q.a }));
    list.push({ g: q.g, s: q.s, q: q.q, opts: shuffle(opts) });
  }
}

function startGame(n){
  ctx();
  prepare(n);
  idx = 0; score = 0;
  show();
}

function intro(){
  stopSuspense(); clearTimeout(qTimer);
  app.innerHTML = `
    <h1>MİLYONÇU</h1>
    <p>${SCHOOL}</p>
    <p class="small">${TEACHERS}<br>Azərbaycan dili, riyaziyyat və ingilis dili müəllimləri tərəfindən hazırlanıb</p>
    <p>Neçə sual olsun?</p>
    <button class="btn" onclick="ctx();playTheme();setTimeout(()=>startGame(25),200)">25 sual</button>
    <button class="btn" onclick="ctx();startGame(50)">50 sual</button>
    <button class="btn" onclick="ctx();startGame(100)">100 sual</button>
  `;
}

function show(){
  if (idx >= list.length) return finish();
  locked = false;
  const it = list[idx];
  app.innerHTML = `
    <p class="small">Sual ${idx+1} / ${list.length} · Sinif ${it.g} · ${SUBJ[it.s]} · Xal: ${score}</p>
    <div class="bar"><div style="width:${(idx/list.length)*100}%"></div></div>
    <h2>${it.q}</h2>
    <div id="opts">
    ${it.opts.map((o,i)=>`<button class="btn opt" onclick="answer(${i})">${"ABCD"[i]}) ${o.t}</button>`).join("")}
    </div>
  `;
  sfxQuestion();
  setTimeout(startSuspense, 500);
  if (TIME_PER_Q > 0){
    clearTimeout(qTimer);
    qTimer = setTimeout(() => answer(-1), TIME_PER_Q * 1000);
  }
}

function answer(i){
  if (locked) return;
  locked = true;
  stopSuspense(); clearTimeout(qTimer);
  const buttons = document.querySelectorAll("#opts .btn");
  const correctIdx = list[idx].opts.findIndex(o => o.c);
  buttons.forEach((b, k) => {
    if (k === correctIdx) b.classList.add("right");
    else if (k === i) b.classList.add("wrong");
  });
  if (i >= 0 && list[idx].opts[i].c){ score++; sfxRight(); }
  else sfxWrong();
  setTimeout(() => { idx++; show(); }, 1600);
}

function finish(){
  if (score / list.length >= WIN_RATE) return win();
  app.innerHTML = `
    <h1>Nəticə</h1>
    <p>${score} / ${list.length} düzgün cavab</p>
    <p class="small">Qalib olmaq üçün ən azı ${Math.round(WIN_RATE*100)}% düzgün cavab lazımdır.</p>
    <button class="btn" onclick="intro()">Yenidən başla</button>
  `;
}

function win(){
  app.innerHTML = `
    <div class="medal">🥇</div>
    <h1>TƏBRİKLƏR!</h1>
    <p>${score} / ${list.length} düzgün cavab</p>
    <button class="btn" onclick="intro()">Yenidən başla</button>
  `;
  sfxWin();
}

intro();
</script>
</body>
</html>
